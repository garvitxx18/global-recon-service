spring:
  application:
    name: global-recon-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/global_recon;MODE=PostgreSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  cloud:
    openfeign:
      client:
        config:
          llmClient:
            connect-timeout: 5000
            read-timeout: 30000
            logger-level: basic
          geminiClient:
            connect-timeout: 10000
            read-timeout: 90000
            logger-level: basic

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

llm:
  provider: agent
  mock-enabled: false
  api:
    url: http://localhost:9080
    path: /v1/complete
  gemini:
    base-url: https://generativelanguage.googleapis.com
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.6-flash
  agent:
    base-url: ${AGENT_BASE_URL:}
    app-name: global_recon

recon:
  chunk-size: 10000
  queue-workers: 4

logging:
  level:
    global.recon.service.feignclient.GeminiClient: INFO
    global.recon.service.feignclient.AdkClient: INFO

---
spring:
  config:
    activate:
      on-profile: local
llm:
  provider: mock
  mock-enabled: true
recon:
  dev-default-email: tester@company.com
logging:
  file:
    name: logs/global-recon.log

---
spring:
  config:
    activate:
      on-profile: cloud
  h2:
    console:
      enabled: false
llm:
  provider: agent
  mock-enabled: false
  agent:
    base-url: ${AGENT_BASE_URL:https://global-recon-agent-869596149274.us-central1.run.app}
    app-name: global_recon
