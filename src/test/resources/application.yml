spring:
  datasource:
    url: jdbc:h2:mem:global_recon;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

llm:
  provider: mock
  mock-enabled: true
  gemini:
    base-url: https://generativelanguage.googleapis.com
    api-key: test-not-used
    model: gemini-3.6-flash
  api:
    url: http://localhost:9080
    path: /v1/complete
