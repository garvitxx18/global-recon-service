spring:
  datasource:
    url: jdbc:h2:mem:global_recon;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

llm:
  mock-enabled: true
  api:
    url: http://localhost:9080
    path: /v1/complete
