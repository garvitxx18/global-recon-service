services:
  mysql:
    image: mysql:8.4
    container_name: global-recon-mysql
    environment:
      MYSQL_DATABASE: global_recon
      MYSQL_USER: recon
      MYSQL_PASSWORD: recon
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - global-recon-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urecon", "-precon"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  global-recon-mysql:
